---
name: Publish to PyPI

on:
  push:
    tags:
      - "v*" # Run only when a tag starting with 'v' is pushed
  # checkov:skip=CKV_GHA_7:Tag input is the build entry point, validated against the package version before any build
  # It selects which existing tag to publish; no other user parameter affects the build output.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.3.0)"
        required: true
        type: string

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Validate tag version matches package version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Extract tag version (remove 'v' prefix) from the dispatch
          # input when run manually, otherwise from the pushed tag
          if [ -n "$INPUT_TAG" ]; then
            # checkout accepts any ref, so reject a branch or commit SHA
            # here rather than publishing from something that is not a tag
            if ! git rev-parse --verify --quiet "refs/tags/$INPUT_TAG" >/dev/null; then
              echo "ERROR: '$INPUT_TAG' is not a tag in this repository"
              exit 1
            fi
            GIT_TAG=${INPUT_TAG#v}
          else
            GIT_TAG=${GITHUB_REF#refs/tags/v}
          fi
          echo "Git tag version: $GIT_TAG"

          # Get package version from hatch
          PACKAGE_VERSION=$(hatch version)
          echo "Package version: $PACKAGE_VERSION"

          # Compare versions
          if [ "$GIT_TAG" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: Git tag version ($GIT_TAG) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "Version validation successful: $GIT_TAG"

  tests:
    name: Run Tests
    needs: validate-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch
          python -m pip install -e ".[dev,test]"

      - name: Run tests
        run: |
          pytest --cov=gimmie tests/

  build-dist:
    name: Build Distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: |
          python -m build

      - name: Upload package distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: package-distributions
          path: dist/
          retention-days: 1

  publish-to-pypi:
    name: Publish to PyPI
    needs: build-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gimmie # Update this to your project name
    permissions:
      # kics-scan ignore-line
      id-token: write # Required for trusted publishing
      contents: read
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          verify-metadata: true
          verbose: true
          print-hash: true
